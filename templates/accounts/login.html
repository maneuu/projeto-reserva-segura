{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Sistema de Reserva</title>
  <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
</head>

<body>
  <main class="auth-card">
    <h1 class="auth-title">Entrar no sistema</h1>
    <p class="auth-subtitle">Use seu e-mail e senha para acessar as reservas.</p>

    {% for message in messages %}
    <div class="login-error">{{ message }}</div>
    {% endfor %}

    {% if error_message %}
    <div class="login-error">{{ error_message }}</div>
    {% endif %}

    <form method="post" class="auth-form" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="field-group">
        <label for="id_email">E-mail</label>
        <input type="email" id="id_email" name="email" value="{{ email_value }}" autocomplete="email" required>
      </div>

      <div class="field-group">
        <label for="id_password">Senha</label>
        <input type="password" id="id_password" name="password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="submit-btn">Entrar</button>
    </form>

    <p class="auth-footer">
      Ainda não tem conta? <a href="{% url 'accounts:register' %}">Criar cadastro</a>
    </p>
  </main>
</body>

</html>
